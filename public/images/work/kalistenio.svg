<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Kalistenio: today's calisthenics workout on a phone</title><rect width="1600" height="1000" fill="#f2f2f2"/><rect x="560" y="60" width="480" height="880" fill="#000000"/><rect x="580" y="80" width="440" height="840" fill="#ffffff"/><text x="620" y="180" font-size="44" fill="#000000" font-weight="600" text-anchor="start">Today</text><text x="620" y="224" font-size="26" fill="#555555" font-weight="400" text-anchor="start">Upper body · 40 min</text><text x="620" y="330" font-size="32" fill="#000000" font-weight="600" text-anchor="start">70% done</text><rect x="620" y="360" width="360" height="24" fill="#e6e6e6"/><rect x="620" y="360" width="252" height="24" fill="#000000"/><rect x="620" y="540" width="360" height="72" fill="#e6e6e6"/><text x="648" y="586" font-size="28" fill="#000000" font-weight="600" text-anchor="start">Pull-ups</text><text x="952" y="586" font-size="26" fill="#555555" font-weight="400" text-anchor="end">4 × 8</text><rect x="620" y="632" width="360" height="72" fill="#e6e6e6"/><text x="648" y="678" font-size="28" fill="#000000" font-weight="600" text-anchor="start">Dips</text><text x="952" y="678" font-size="26" fill="#555555" font-weight="400" text-anchor="end">3 × 12</text><rect x="620" y="724" width="360" height="72" fill="#e6e6e6"/><text x="648" y="770" font-size="28" fill="#000000" font-weight="600" text-anchor="start">Push-ups</text><text x="952" y="770" font-size="26" fill="#555555" font-weight="400" text-anchor="end">3 × 20</text><rect x="620" y="816" width="360" height="72" fill="#e6e6e6"/><text x="648" y="862" font-size="28" fill="#000000" font-weight="600" text-anchor="start">L-sit</text><text x="952" y="862" font-size="26" fill="#555555" font-weight="400" text-anchor="end">3 × 20s</text></svg>
