# Self-hosting: the production image (Dockerfile, --target runtime), with its migrations applied
# first. Configure it in .env (see .env.example and the Self-hosting page of the docs), then:
#   docker compose -f docker-compose.prod.yml up -d --build              # with your own database
#   docker compose -f docker-compose.prod.yml --profile db up -d --build # with Postgres here too
name: spotcraft-prod

x-app: &app
  build:
    # The workspace root, and where the app sits in it (see .env.example).
    context: ${SPOTCRAFT_BUILD_CONTEXT:-../..}
    dockerfile: ${SPOTCRAFT_APP_DIR:-apps/dashboard}/Dockerfile
    target: runtime
    args:
      APP_DIR: ${SPOTCRAFT_APP_DIR:-apps/dashboard}
      VITE_SPOTCRAFT_SOURCE_URL: ${VITE_SPOTCRAFT_SOURCE_URL:-}
  image: spotcraft:latest
  env_file: .env

services:
  # Applies the migrations in drizzle/, then exits; the app starts only if it succeeded.
  migrate:
    <<: *app
    command: ["node", "migrate.mjs"]
    restart: "no"
    depends_on:
      # Only when Postgres runs here (--profile db); otherwise DATABASE_URL points elsewhere.
      postgres:
        condition: service_healthy
        required: false

  app:
    <<: *app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Optional (--profile db): Postgres on the same host. Set DATABASE_URL to
  # postgresql://postgres:<POSTGRES_PASSWORD>@postgres:5432/spotcraft in .env.
  postgres:
    profiles: [db]
    image: pgvector/pgvector:pg17  # Postgres 17 with pgvector (semantic search)
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: spotcraft
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spotcraft"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Optional (--profile s3): an S3-compatible store for images on the same host. Set
  # S3_ENDPOINT=http://s3:8333 and S3_BUCKET in .env (any keys; it has no auth on this network).
  s3:
    profiles: [s3]
    image: chrislusf/seaweedfs:4.50
    command: ["server", "-s3", "-dir=/data", "-ip.bind=0.0.0.0"]
    restart: unless-stopped
    volumes:
      - s3:/data

volumes:
  postgres:
  s3:
