name: CI

# On dev and main, and pull requests. Vercel holds main's production
# deployments until these jobs pass (Deployment Checks, see DEPLOY.md), so keep
# the job names stable.
on:
  pull_request:
  push:
    branches: [main, dev]

# A newer push to the same branch or pull request supersedes the running checks
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Spotcraft's own checks, as its repository runs them: typecheck and unit
  # tests, no services
  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dashboard typecheck
      - run: pnpm --filter dashboard test

  # The site's lint and production build. The build reads its pages from
  # Spotcraft, so a throwaway one runs here with the sample content in
  # .github/ci/spotcraft-content
  website:
    name: website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spotcraft
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d spotcraft"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Images: an S3-compatible store, as `pnpm db:start` runs locally
      # (service containers can't take a command, so it's started here)
      - name: Start SeaweedFS (S3)
        run: |
          docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs:4.50 server -s3 -dir=/data -ip.bind=0.0.0.0
          for _ in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8333/ && break; sleep 1; done

      # .env.example's values match the services above; the secrets are per run
      - name: Configure Spotcraft
        working-directory: apps/dashboard
        run: |
          token=$(openssl rand -hex 32)
          webhook=$(openssl rand -hex 32)
          cp .env.example .env
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -hex 32)|" .env
          echo "SPOTCRAFT_API_TOKEN=$token" >> .env
          echo "WEBHOOK_SECRET=$webhook" >> .env
          echo "::add-mask::$token"
          echo "::add-mask::$webhook"
          echo "SPOTCRAFT_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "SPOTCRAFT_WEBHOOK_SECRET=$webhook" >> "$GITHUB_ENV"

      - run: pnpm db:migrate

      - name: Start Spotcraft
        working-directory: apps/dashboard
        run: |
          pnpm build
          nohup node --env-file=.env .output/server/index.mjs > "$RUNNER_TEMP/spotcraft.log" 2>&1 &
          # Up once its API answers, even with "no such site" (404)
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/vinski/api/site || true)
            [ "$code" = "404" ] || [ "$code" = "200" ] && exit 0
            sleep 1
          done
          echo "Spotcraft didn't start"; exit 1

      - name: Import the sample content
        run: pnpm --filter dashboard content:import ../../.github/ci/spotcraft-content --site vinski --create-site --site-url http://localhost:3001 --apply

      - run: pnpm lint

      - name: Build the site
        run: pnpm build
        env:
          SPOTCRAFT_URL: http://localhost:3000/vinski

      - name: Spotcraft's log
        if: failure()
        run: cat "$RUNNER_TEMP/spotcraft.log" || true
